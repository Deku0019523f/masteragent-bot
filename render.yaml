services:
  - type: worker
    name: masteragent-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: masteragent-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: COMMAND_PREFIX
        value: "!"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_PATH
        value: /data/masteragent.db
      - key: DEFAULT_WELCOME_ENABLED
        value: "true"
      - key: DEFAULT_TICKETS_ENABLED
        value: "true"
      - key: DEFAULT_PROJECTS_ENABLED
        value: "true"
      - key: DEFAULT_VOICE_ENABLED
        value: "false"
